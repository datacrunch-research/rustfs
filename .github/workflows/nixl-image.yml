# Builds Dockerfile.nixl (RustFS with the NIXL/UCX transport) for linux/amd64
# and linux/arm64 on native hosted runners. Nothing is pushed: each platform's
# image is a workflow artifact (a `docker load` tarball), and whoever holds the
# target registry's credentials pushes the two and joins them into one tag.

name: NIXL image

on:
  push:
    branches:
      - "rainj-me/kvcache-bucket-1.0.5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixl-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    if: github.repository == 'datacrunch-research/rustfs'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.nixl
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
            RUSTFS_BUILD_VERSION=nixl-${{ github.sha }}
          tags: rustfs-nixl:${{ matrix.arch }}
          outputs: type=docker,dest=${{ runner.temp }}/rustfs-nixl-${{ matrix.arch }}.tar
          provenance: false

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfs-nixl-${{ matrix.arch }}
          path: ${{ runner.temp }}/rustfs-nixl-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 3
